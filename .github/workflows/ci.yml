name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned so that a new compiler release cannot fail a pull request on its
  # own. Raise it deliberately, with the lint fixes it asks for.
  RUST_VERSION: "1.100.0"

jobs:
  check:
    name: Format, lint, test
    # Our own runners: the build is mostly compiling AWS-LC from C.
    runs-on: arc-runner-set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"
          rustc --version
      - name: License headers
        run: python3 scripts/license-headers.py --check
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Model-checked client hand-offs
        run: ./scripts/test-model.sh

  uring:
    name: Real io_uring checks
    # A hosted runner is a full virtual machine. Container runtimes commonly
    # block the io_uring system calls, so this job does not run in a pod.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - name: Run
        run: |
          # http_uring registers buffers, which are pinned and count against RLIMIT_MEMLOCK (small on hosted runners).
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo build --release -p longshore-bench --bin echo_uring --bin http_uring
          cd target/release
          timeout 60 ./echo_uring
          timeout 60 ./echo_uring --zc
          timeout 60 ./echo_uring --total 1000003 --chunk 4096 --zc
          timeout 60 ./http_uring selftest
      - name: Client I/O threads failing and torn down under load
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo build --release -p longshore-bench --features fault-injection --bin client_faults
          cd target/release
          timeout 250 ./client_faults break tick
          timeout 250 ./client_faults break ring
          timeout 250 ./client_faults churn
      - name: The same teardown under the address and thread sanitizers
        env:
          # The sanitizers need a nightly compiler and a standard library
          # built with them. Pinned, like the stable toolchain above.
          NIGHTLY: nightly-2026-11-01
          RUSTFLAGS: ""
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          rustup toolchain install "${NIGHTLY}" --profile minimal --component rust-src
          for sanitizer in address thread; do
            RUSTFLAGS="-Zsanitizer=${sanitizer}" cargo "+${NIGHTLY}" build -Zbuild-std \
              --target x86_64-unknown-linux-gnu --target-dir "target/${sanitizer}" \
              -p longshore-bench --features fault-injection --bin client_faults
            timeout 600 "target/${sanitizer}/x86_64-unknown-linux-gnu/debug/client_faults" churn --rounds 300 --any-memory
            timeout 600 "target/${sanitizer}/x86_64-unknown-linux-gnu/debug/client_faults" break tick
          done
