name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: License headers
        run: python3 scripts/license-headers.py --check
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Real io_uring checks
        run: |
          cargo build --release -p longshore-bench --bin echo_uring --bin http_uring
          cd target/release
          timeout 60 ./echo_uring
          timeout 60 ./echo_uring --zc
          timeout 60 ./echo_uring --total 1000003 --chunk 4096 --zc
          timeout 60 ./http_uring selftest
