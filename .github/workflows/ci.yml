name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned so that a new compiler release cannot fail a pull request on its
  # own. Raise it deliberately, with the lint fixes it asks for.
  RUST_VERSION: "1.100.0"
  # The crates whose code depends on the TLS provider.
  TLS_CRATES: -p longshore_tls -p longshore_stream -p longshore_http_client -p longshore_s3 -p longshore

jobs:
  check:
    name: Format, lint, test
    # Our own runners: the build is mostly compiling AWS-LC from C.
    runs-on: arc-runner-set
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt
          rustup default "${RUST_VERSION}"
          rustc --version
      - name: License headers
        run: python3 scripts/license-headers.py --check
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: |
          # Every feature on covers the default build, all three TLS
          # providers and fault-injection. TLS off has code of its own
          # (not(feature = "tls-core")), and so does each provider alone (the
          # stand-ins for the others); longshore_tls itself needs a provider.
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --workspace --exclude longshore-bench --exclude longshore_tls --all-targets --no-default-features -- -D warnings
          for provider in ring rustls; do
            cargo clippy $TLS_CRATES --all-targets --no-default-features --features "$provider" -- -D warnings
          done
      - name: Plain, ring and rustls builds hold no AWS-LC
        run: |
          check() { # features, crates that must be absent
            tree=$(cargo tree -p longshore --no-default-features $1 -e normal --prefix none)
            for crate in $2; do
              if echo "$tree" | grep -q "^$crate "; then
                echo "ERROR: longshore --no-default-features $1 depends on $crate" >&2
                echo "$tree" >&2
                exit 1
              fi
            done
          }
          check "" "longshore_tls rustls aws-lc-sys aws-lc-rs"
          check "--features ring" "aws-lc-sys aws-lc-rs"
          check "--features rustls" "aws-lc-sys aws-lc-rs"
      - name: Documentation
        # What docs.rs would build. A broken link or a doc example that no
        # longer compiles fails here, not after a release.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --exclude longshore-bench --features longshore/sim
      - name: Test
        run: |
          # Real-kernel io_uring E2E tests in `longshore --test e2e` run in the
          # `uring` job on a full Linux VM; container pods can restrict io_uring
          # registration opcodes (such as IORING_REGISTER_PBUF_RING).
          cargo test --workspace --exclude longshore
          cargo test -p longshore --lib
          cargo test -p longshore --doc
          cargo test --workspace --exclude longshore-bench --exclude longshore --exclude longshore_tls --no-default-features
          cargo test -p longshore --lib --no-default-features
          cargo test -p longshore --doc --no-default-features
          for provider in ring rustls; do
            cargo test -p longshore_tls -p longshore_stream -p longshore_http_client -p longshore_s3 --no-default-features --features "$provider"
            cargo test -p longshore --lib --no-default-features --features "$provider"
          done
          cargo test -p longshore_common --features fault-injection
      - name: Model-checked client hand-offs
        run: ./scripts/test-model.sh

  macos:
    name: Portable backend on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy
          rustup default "${RUST_VERSION}"
      - name: Lint
        run: |
          cargo clippy -p longshore_common -p longshore_s3 --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          cargo test -p longshore_common
          cargo test -p longshore_common --features fault-injection
          cargo test -p longshore_s3 --test client_portable

  uring:
    name: Real io_uring checks
    # A hosted runner is a full virtual machine. Container runtimes commonly
    # block the io_uring system calls, so this job does not run in a pod.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
      - name: Run
        run: |
          # http_uring registers buffers, which are pinned and count against RLIMIT_MEMLOCK (small on hosted runners).
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo build --release -p longshore-bench --bin contract_uring --bin server_uring --bin file_uring --bin echo_uring --bin http_uring
          cd target/release
          timeout 60 ./contract_uring
          timeout 60 ./contract_uring --posix
          timeout 60 ./server_uring
          timeout 60 ./server_uring --posix
          timeout 60 ./file_uring
          timeout 60 ./file_uring --posix
          timeout 60 ./echo_uring
          timeout 60 ./echo_uring --zc
          timeout 60 ./echo_uring --total 1000003 --chunk 4096 --zc
          timeout 60 ./http_uring selftest
      - name: E2E suite (real io_uring, POSIX, simulator)
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test -p longshore --test e2e
          cargo test -p longshore --test e2e --no-default-features
      - name: Client I/O threads failing and torn down under load
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo build --release -p longshore-bench --features fault-injection --bin client_faults --bin uring_faults
          cd target/release
          timeout 250 ./client_faults break tick
          timeout 250 ./client_faults break ring
          timeout 250 ./client_faults churn
          timeout 60 ./uring_faults

  sanitizers:
    name: Client teardown under the address and thread sanitizers
    # Two standard library builds and two sanitized runs: more than the
    # uring job's time allows, so they run alongside it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The sanitizers need a nightly compiler and a standard library
      # built with them. Pinned, like the stable toolchain above.
      NIGHTLY: nightly-2026-11-01
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install "${NIGHTLY}" --profile minimal --component rust-src
      - name: Run
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          for sanitizer in address thread; do
            RUSTFLAGS="-Zsanitizer=${sanitizer}" cargo "+${NIGHTLY}" build -Zbuild-std \
              --target x86_64-unknown-linux-gnu --target-dir "target/${sanitizer}" \
              -p longshore-bench --features fault-injection --bin client_faults
            timeout 600 "target/${sanitizer}/x86_64-unknown-linux-gnu/debug/client_faults" churn --rounds 300 --any-memory
            timeout 600 "target/${sanitizer}/x86_64-unknown-linux-gnu/debug/client_faults" break tick
          done
