# Coverage-guided fuzzing of the parsers (fuzz/, scripts/fuzz.sh).
# A pull request fuzzes each target for a minute, a push to main and the
# nightly run for ten. The corpus of each target is kept in the Actions
# cache between runs, so later runs start from what earlier ones found.

name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Run time per target, in seconds
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The same nightly as the sanitizer job in ci.yml; raise them together.
  NIGHTLY: nightly-2026-11-01

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dns_response, http_head, list_response, multipart_response, tls_record]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install "${NIGHTLY}" --profile minimal

      - name: Cache cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.NIGHTLY }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz

      - name: Restore the corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          FUZZ_TOOLCHAIN: ${{ env.NIGHTLY }}
          FUZZ_TARGETS: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
        run: scripts/fuzz.sh

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
