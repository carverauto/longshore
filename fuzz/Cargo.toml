# Development tooling only: coverage-guided fuzzing with cargo-fuzz (libFuzzer).
# Not a workspace member, so production crates never see these dependencies.
#   cargo +nightly fuzz run dns_response -- -max_total_time=60
# On macOS add `-s none`: the nightly AddressSanitizer runtime hangs at startup there.
# The parsers contain no unsafe code, so bounds errors still surface as panics.
[package]
name = "longshore-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[features]
# Never on here. The model test's source, compiled into `tcp_model_steps`,
# asks whether TLS is compiled in; this names the feature it asks for.
tls-core = []

[dependencies]
libfuzzer-sys = "0.4"
# The record layer, with all three providers, through its own crate. The
# parsers are compiled from their source files, not through the longshore
# crate: its checksum dependency has a C-ABI library target that does not
# link under the fuzzer's instrumentation. longshore_tls does not depend on it.
longshore_tls = { path = "../crates/longshore_tls", features = ["aws-lc", "ring", "rustls"] }
# The TCP connection set and the simulator it is modelled on, without TLS:
# neither depends on the checksum crate. The model test's own source is
# compiled into `tcp_model_steps`.
longshore_tcp = { path = "../crates/longshore_tcp", default-features = false }
longshore_common = { path = "../crates/longshore_common", features = ["sim"] }
# rustls's key type, to key its record layer from fuzzer-chosen bytes.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[[bin]]
name = "dns_response"
path = "fuzz_targets/dns_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_head"
path = "fuzz_targets/http_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_record"
path = "fuzz_targets/tls_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "list_response"
path = "fuzz_targets/list_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart_response"
path = "fuzz_targets/multipart_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_framing"
path = "fuzz_targets/tcp_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_model_steps"
path = "fuzz_targets/tcp_model_steps.rs"
test = false
doc = false
bench = false
