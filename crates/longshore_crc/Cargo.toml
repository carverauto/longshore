[package]
name = "longshore_crc"
description = "CRC-64/NVME and CRC-32C for object storage checksums"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
autotests = false

[dependencies]
# Adopted by benchmark: see bench/results/m5-checksums.md. `std` is the
# smallest feature set that builds outside no_std; the C FFI and CLI features
# stay off.
crc-fast.workspace = true

[dev-dependencies]
# The allocation guard its property test runs under.
longshore_common.workspace = true
hegeltest.workspace = true

[[test]]
name = "checksum_props"
path = "tests/checksum/props.rs"
