[package]
name = "longshore_dns"
description = "A DNS resolver for a fixed set of names, driven by longshore I/O completions"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
autotests = false

[dependencies]
longshore_common.workspace = true

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore_common = { workspace = true, features = ["sim"] }
hegeltest.workspace = true

[[test]]
name = "dns_codec_props"
path = "tests/dns/codec_props.rs"

[[test]]
name = "dns_resolver"
path = "tests/dns/resolver.rs"

[[test]]
name = "dns_resolver_edges"
path = "tests/dns/resolver_edges.rs"

[[test]]
name = "dns_resolver_forged"
path = "tests/dns/resolver_forged.rs"

[[test]]
name = "dns_resolver_props"
path = "tests/dns/resolver_props.rs"

[[test]]
name = "dns_resolver_families"
path = "tests/dns/resolver_families.rs"

[[test]]
name = "dns_resolver_segments"
path = "tests/dns/resolver_segments.rs"
