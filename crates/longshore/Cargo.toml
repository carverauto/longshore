[package]
name = "longshore"
description = "Object storage client for Linux io_uring: one thread, memory allocated at start-up, object bodies sent without copying"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "../../README.md"
keywords = ["s3", "object-storage", "io-uring", "gcs"]
categories = ["network-programming", "web-programming::http-client"]
autotests = false

[features]
# The deterministic simulator: an `Io` with virtual sockets, files and time.
# Meant for tests, in this crate and in crates that use it.
sim = []

[dependencies]
# AES-GCM through AWS-LC's scatter/gather interface, chosen by benchmark:
# see bench/results/m6-aead.md. The safe aws-lc-rs wrapper does not expose
# that interface, so the record layer calls aws-lc-sys directly.
aws-lc-sys = "0.47"
# Adopted by benchmark: see bench/results/m5-checksums.md. `std` is the
# smallest feature set that builds outside no_std; the C FFI and CLI features
# stay off.
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
# SHA-256 and HMAC-SHA256 for request signing.
ring = { version = "0.17", default-features = false }
# The handshake, and only the handshake: certificate validation and key
# agreement come from rustls. Once it completes, its traffic keys move to
# `tls::record` and rustls is dropped. TLS 1.3 only (the `tls12` feature is off).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore = { path = ".", features = ["sim"] }
hegeltest = "0.52.2"
# Test certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }

