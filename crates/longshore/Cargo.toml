[package]
name = "longshore"
description = "Object storage client for Linux io_uring: one thread, memory allocated at start-up, object bodies sent without copying"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "../../README.md"
keywords = ["s3", "object-storage", "io-uring", "gcs"]
categories = ["network-programming", "web-programming::http-client"]
autotests = false

[features]
default = ["aws-lc"]
# TLS with the default provider, AWS-LC. Kept for existing manifests.
tls = ["aws-lc"]
# TLS 1.3 with AWS-LC sealing and opening records and rustls's AWS-LC
# provider for the handshake.
aws-lc = ["tls-core", "longshore_s3/aws-lc", "longshore_http_client/aws-lc", "longshore_stream/aws-lc", "longshore_tcp/aws-lc", "longshore_tls/aws-lc"]
# TLS 1.3 with ring sealing and opening records and rustls's ring provider
# for the handshake. No AWS-LC in the build.
ring = ["tls-core", "longshore_s3/ring", "longshore_http_client/ring", "longshore_stream/ring", "longshore_tcp/ring", "longshore_tls/ring"]
# TLS 1.3 entirely from rustls, its record encryption included, with its
# ring provider. rustls allocates a buffer for every record it seals; that
# runs inside the allocation exception the handshake uses.
rustls = ["tls-core", "longshore_s3/rustls", "longshore_http_client/rustls", "longshore_stream/rustls", "longshore_tcp/rustls", "longshore_tls/rustls"]
# Turned on by `aws-lc`, `ring` or `rustls`: the TLS code itself, without a provider.
# Not meant to be named on its own.
tls-core = ["longshore_stream/tls-core", "longshore_tcp/tls-core", "longshore_http_client/tls-core", "longshore_s3/tls-core", "dep:longshore_tls"]
# The deterministic simulator, for tests: see `longshore_common`.
sim = ["longshore_common/sim"]
# Lets a test break a running client's ring: see `longshore_s3`.
fault-injection = ["longshore_s3/fault-injection"]

[dependencies]
longshore_common.workspace = true
longshore_crc.workspace = true
longshore_dns.workspace = true
longshore_file.workspace = true
longshore_http_client.workspace = true
longshore_mailbox.workspace = true
longshore_s3.workspace = true
longshore_stream.workspace = true
longshore_tcp.workspace = true
longshore_tls = { workspace = true, optional = true }

[dev-dependencies]
# By path only, with no version: cargo leaves such a development dependency
# out of the published crate, and turns `sim` on for `tests/e2e` without
# enabling default `tls` under `--no-default-features`.
longshore = { path = ".", default-features = false, features = ["sim"] }
rcgen.workspace = true

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[package.metadata.docs.rs]
# io_uring is Linux only, and the simulator is part of the documented API.
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
features = ["sim"]

[lints]
workspace = true
