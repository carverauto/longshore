[package]
name = "longshore_s3"
description = "An object storage client for S3 and stores that speak its protocol, and Google Cloud Storage: one thread per ring, memory allocated at start-up, bodies sent without copying"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "README.md"
autotests = false

[features]
default = ["tls"]
tls = ["longshore_http_client/tls", "longshore_stream/tls", "dep:longshore_tls"]
# Lets a test break a running client's ring: see `Client::inject_fault`.
# Off in every ordinary build.
fault-injection = ["longshore_common/fault-injection"]

[dependencies]
longshore_common.workspace = true
longshore_crc.workspace = true
longshore_dns.workspace = true
longshore_http_client.workspace = true
longshore_mailbox.workspace = true
longshore_stream.workspace = true
longshore_tls = { workspace = true, optional = true }
# SHA-256 and HMAC-SHA256 for request signing.
ring.workspace = true

# The model checker behind `tests/client/model.rs`. Present only in a build
# with `--cfg longshore_model`, which nothing but that test asks for.
[target.'cfg(longshore_model)'.dependencies]
loom.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(longshore_model)'] }

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore_common = { workspace = true, features = ["sim"] }
hegeltest.workspace = true
# Test certificates.
rcgen.workspace = true

