[package]
name = "longshore_http_client"
description = "An HTTP/1.1 client over longshore I/O, plain or TLS, with a connection pool, and a server used by tests"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "README.md"
autotests = false

[features]
default = ["tls"]
tls = ["longshore_stream/tls", "dep:longshore_tls"]

[dependencies]
longshore_common.workspace = true
longshore_stream.workspace = true
longshore_tls = { workspace = true, optional = true }

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore_common = { workspace = true, features = ["sim"] }
hegeltest.workspace = true
# Test certificates.
rcgen.workspace = true

[[test]]
name = "http_failures"
path = "tests/http/failures.rs"

[[test]]
name = "http_framing"
path = "tests/http/framing.rs"

[[test]]
name = "http_head_props"
path = "tests/http/head_props.rs"

[[test]]
name = "http_https"
path = "tests/http/https.rs"

[[test]]
name = "http_pool"
path = "tests/http/pool.rs"

[[test]]
name = "http_requests"
path = "tests/http/requests.rs"

[[test]]
name = "http_chunked_props"
path = "tests/http/chunked_props.rs"

[[test]]
name = "http_head_edges"
path = "tests/http/head_edges.rs"

[[test]]
name = "http_framing_edges"
path = "tests/http/framing_edges.rs"

[[test]]
name = "http_pool_edges"
path = "tests/http/pool_edges.rs"

[[test]]
name = "http_server_refusals"
path = "tests/http/server_refusals.rs"

[[test]]
name = "http_adversarial"
path = "tests/http/adversarial.rs"

[lints]
workspace = true
