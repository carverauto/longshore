[package]
name = "longshore_http_client"
description = "An HTTP/1.1 client over longshore I/O, plain or TLS, with a connection pool, and a server used by tests"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "README.md"
autotests = false

[features]
default = ["aws-lc"]
# TLS with the default provider, AWS-LC. Kept for existing manifests.
tls = ["aws-lc"]
# TLS 1.3 with AWS-LC sealing and opening records and rustls's AWS-LC
# provider for the handshake.
aws-lc = ["tls-core", "longshore_stream/aws-lc", "longshore_tls/aws-lc"]
# TLS 1.3 with ring sealing and opening records and rustls's ring provider
# for the handshake. No AWS-LC in the build.
ring = ["tls-core", "longshore_stream/ring", "longshore_tls/ring"]
# TLS 1.3 entirely from rustls, its record encryption included, with its
# ring provider. rustls allocates a buffer for every record it seals; that
# runs inside the allocation exception the handshake uses.
rustls = ["tls-core", "longshore_stream/rustls", "longshore_tls/rustls"]
# Turned on by `aws-lc`, `ring` or `rustls`: the TLS code itself, without a provider.
# Not meant to be named on its own.
tls-core = ["longshore_stream/tls-core", "dep:longshore_tls"]

[dependencies]
longshore_common.workspace = true
longshore_stream.workspace = true
longshore_tls = { workspace = true, optional = true }

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore_common = { workspace = true, features = ["sim"] }
hegeltest.workspace = true
# Test certificates.
rcgen.workspace = true

[[test]]
name = "http_failures"
path = "tests/http/failures.rs"

[[test]]
name = "http_framing"
path = "tests/http/framing.rs"

[[test]]
name = "http_head_props"
path = "tests/http/head_props.rs"

[[test]]
name = "http_https"
path = "tests/http/https.rs"

[[test]]
name = "http_pool"
path = "tests/http/pool.rs"

[[test]]
name = "http_requests"
path = "tests/http/requests.rs"

[[test]]
name = "http_chunked_props"
path = "tests/http/chunked_props.rs"

[[test]]
name = "http_head_edges"
path = "tests/http/head_edges.rs"

[[test]]
name = "http_framing_edges"
path = "tests/http/framing_edges.rs"

[[test]]
name = "http_pool_edges"
path = "tests/http/pool_edges.rs"

[[test]]
name = "http_server_refusals"
path = "tests/http/server_refusals.rs"

[[test]]
name = "http_server_config"
path = "tests/http/server_config.rs"

[[test]]
name = "http_adversarial"
path = "tests/http/adversarial.rs"

[[test]]
name = "http_client_config"
path = "tests/http/client_config.rs"

[lints]
workspace = true
