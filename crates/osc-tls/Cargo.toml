[package]
name = "osc-tls"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# AES-GCM through AWS-LC's scatter/gather interface, chosen by benchmark:
# see bench/results/m6-aead.md. The safe aws-lc-rs wrapper does not expose
# that interface, so this crate calls aws-lc-sys directly.
aws-lc-sys = "0.47"
# The handshake, and only the handshake: certificate validation and key
# agreement come from rustls. Once it completes, its traffic keys move to
# `record` and rustls is dropped. TLS 1.3 only (the `tls12` feature is off).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"
# For the scoped allocation exception around the handshake.
osc-io = { path = "../osc-io" }

[dev-dependencies]
hegeltest = "0.52.2"
# An independent AES-GCM implementation to cross-check records against.
ring = { version = "0.17", default-features = false }
# Test certificates.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
