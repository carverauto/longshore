[package]
name = "longshore_common"
description = "The I/O layer of longshore: one trait, an io_uring backend with memory allocated at start-up, and a deterministic simulator for tests"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "README.md"
autotests = false

[features]
# The deterministic simulator: an `Io` with virtual sockets, files and time.
# Meant for tests, in this crate and in crates that use it.
sim = []
# Lets a test break a real ring while it runs: see `io::uring::Fault`. Off
# in every ordinary build.
fault-injection = []

[dependencies]

[dev-dependencies]
# By path only, with no version: cargo leaves such a development dependency
# out of the published crate, and a crate cannot name itself on the registry.
longshore_common = { path = ".", features = ["sim"] }
hegeltest.workspace = true

[[test]]
name = "io_extents_turn"
path = "tests/io/extents_turn.rs"

[[test]]
name = "io_props"
path = "tests/io/props.rs"

[[test]]
name = "io_engine_adversarial"
path = "tests/io/engine_adversarial.rs"

[[test]]
name = "io_posix_adversarial"
path = "tests/io/posix_adversarial.rs"

[[test]]
name = "io_posix"
path = "tests/io/posix.rs"

[[test]]
name = "io_posix_contract"
path = "tests/io/posix_contract.rs"

[[test]]
name = "io_posix_faults"
path = "tests/io/posix_faults.rs"

[[test]]
name = "io_posix_alloc"
path = "tests/io/posix_alloc.rs"

[[test]]
name = "io_posix_files"
path = "tests/io/posix_files.rs"

[[test]]
name = "guard_death"
path = "tests/guard/death.rs"

[[test]]
name = "sim_echo"
