[[test]]
name = "sim_faults"
path = "tests/sim/faults.rs"

[[test]]
name = "sim_armed_faults"
path = "tests/sim/armed_faults.rs"

[[test]]
name = "sim_sockets"
path = "tests/sim/sockets.rs"

[[test]]
name = "sim_traces"
path = "tests/sim/traces.rs"

[[test]]
name = "sim_contract"
path = "tests/sim/contract.rs"

[[test]]
