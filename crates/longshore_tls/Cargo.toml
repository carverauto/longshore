[package]
name = "longshore_tls"
description = "TLS 1.3 for longshore: the handshake from rustls, records sealed and opened with AES-GCM from AWS-LC"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "README.md"
autotests = false

[dependencies]
longshore_common.workspace = true
# AES-GCM through AWS-LC's scatter/gather interface, chosen by benchmark:
# see bench/results/m6-aead.md. The safe aws-lc-rs wrapper does not expose
# that interface, so the record layer calls aws-lc-sys directly.
aws-lc-sys.workspace = true
# The handshake, and only the handshake: certificate validation and key
# agreement come from rustls. Once it completes, its traffic keys move to
# `record` and rustls is dropped. TLS 1.3 only (the `tls12` feature is off).
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore_common = { workspace = true, features = ["sim"] }
hegeltest.workspace = true
# Test certificates.
rcgen.workspace = true
# A second AES-GCM, to check sealed records against.
ring.workspace = true

[[test]]
name = "tls_handshake"
path = "tests/tls/handshake.rs"

[[test]]
name = "tls_handshake_errors"
path = "tests/tls/handshake_errors.rs"

[[test]]
name = "tls_interop"
path = "tests/tls/interop.rs"

[[test]]
name = "tls_record"
path = "tests/tls/record.rs"

[[test]]
name = "tls_record_edges"
path = "tests/tls/record_edges.rs"

[lints]
workspace = true
