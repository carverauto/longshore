[package]
name = "longshore_tls"
description = "TLS 1.3 for longshore: the handshake from rustls, records sealed and opened with AES-GCM from AWS-LC, ring or rustls"
edition.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/carverauto/longshore"
readme = "README.md"
autotests = false

[features]
default = ["aws-lc"]
# Records sealed and opened with AWS-LC's scatter/gather calls, no copy;
# rustls's AWS-LC provider for the handshake.
aws-lc = ["dep:aws-lc-sys", "rustls/aws_lc_rs"]
# Records sealed and opened with ring in place, one copy; rustls's ring
# provider for the handshake.
ring = ["dep:ring", "rustls/ring"]
# Records sealed and opened by rustls's own record encryption, which
# allocates a buffer per sealed record; rustls's ring provider throughout.
rustls = ["rustls/ring"]

[dependencies]
longshore_common.workspace = true
# AES-GCM through AWS-LC's scatter/gather interface, chosen by benchmark:
# see bench/results/m6-aead.md. The safe aws-lc-rs wrapper does not expose
# that interface, so the record layer calls aws-lc-sys directly.
aws-lc-sys = { workspace = true, optional = true }
# AES-GCM for the `ring` provider.
ring = { workspace = true, optional = true }
# The handshake: certificate validation and key agreement come from rustls.
# Once it completes, its traffic keys move to `record`; with the `rustls`
# provider, rustls's record encryption moves with them. TLS 1.3 only (the
# `tls12` feature is off).
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# Turns the simulator on for this crate's own tests.
longshore_common = { workspace = true, features = ["sim"] }
hegeltest.workspace = true
# Test certificates.
rcgen.workspace = true
# A second AES-GCM, to check sealed records against.
ring.workspace = true

[[test]]
name = "tls_handshake"
path = "tests/tls/handshake.rs"

[[test]]
name = "tls_handshake_errors"
path = "tests/tls/handshake_errors.rs"

[[test]]
name = "tls_interop"
path = "tests/tls/interop.rs"

[[test]]
name = "tls_wide_gcm"
path = "tests/tls/wide_gcm.rs"
required-features = ["aws-lc"]

[[test]]
name = "tls_providers"
path = "tests/tls/providers.rs"

[[test]]
name = "tls_record"
path = "tests/tls/record.rs"

[[test]]
name = "tls_record_edges"
path = "tests/tls/record_edges.rs"

[lints]
workspace = true
