[workspace]
resolver = "2"
members = [
    "crates/longshore",
    "crates/longshore_common",
    "crates/longshore_crc",
    "crates/longshore_dns",
    "crates/longshore_http_client",
    "crates/longshore_s3",
    "crates/longshore_tls",
    "crates/longshore-bench",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Internal Dependencies
longshore = { path = "crates/longshore" }
longshore_common = { path = "crates/longshore_common" }
longshore_crc = { path = "crates/longshore_crc" }
longshore_dns = { path = "crates/longshore_dns" }
longshore_http_client = { path = "crates/longshore_http_client" }
longshore_s3 = { path = "crates/longshore_s3" }
longshore_tls = { path = "crates/longshore_tls" }

# External Dependencies
aws-lc-sys = "0.47"
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"

# Test Dependencies.
hegeltest = "0.52"
loom = "0.7"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }

# Benchmark Dependencies.
aes-gcm = "0.11"
aws-lc-rs = "1.19"
# Oracles to verify`longshore_crc` CRC kernels.
crc = "3.4"
crc-fast = "1.10"
crc32c = "0.6"
crc64fast-nvme = "1.2"
criterion = { version = "0.8", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
