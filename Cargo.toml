[workspace]
resolver = "2"
members = [
    "crates/longshore",
    "crates/longshore_common",
    "crates/longshore_crc",
    "crates/longshore_dns",
    "crates/longshore_http_client",
    "crates/longshore_mailbox",
    "crates/longshore_s3",
    "crates/longshore_stream",
    "crates/longshore_tls",
    "crates/longshore-bench",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "Apache-2.0"

[workspace.dependencies]
# Internal Dependencies. The crates are released together, so each names
# the others at exactly its own version.
longshore = { path = "crates/longshore", version = "=0.2.0", default-features = false }
longshore_common = { path = "crates/longshore_common", version = "=0.2.0", default-features = false }
longshore_crc = { path = "crates/longshore_crc", version = "=0.2.0", default-features = false }
longshore_dns = { path = "crates/longshore_dns", version = "=0.2.0", default-features = false }
longshore_http_client = { path = "crates/longshore_http_client", version = "=0.2.0", default-features = false }
longshore_mailbox = { path = "crates/longshore_mailbox", version = "=0.2.0", default-features = false }
longshore_s3 = { path = "crates/longshore_s3", version = "=0.2.0", default-features = false }
longshore_stream = { path = "crates/longshore_stream", version = "=0.2.0", default-features = false }
longshore_tls = { path = "crates/longshore_tls", version = "=0.2.0", default-features = false }

# External Dependencies
aws-lc-sys = "0.47"
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"

# Test Dependencies.
hegeltest = "0.52"
loom = "0.7"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }

# Benchmark Dependencies.
aes-gcm = "0.11"
aws-lc-rs = "1.19"
# Oracles to verify`longshore_crc` CRC kernels.
crc = "3.4"
crc-fast = "1.10"
crc32c = "0.6"
crc64fast-nvme = "1.2"
criterion = { version = "0.8", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
