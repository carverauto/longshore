[workspace]
resolver = "2"
members = ["crates/osc-io", "crates/osc-sim", "crates/osc-dns", "crates/osc-http", "crates/osc-crypto", "crates/osc-checksum", "crates/osc-tls", "crates/osc-store", "crates/osc-bench"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
