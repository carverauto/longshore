# Cross-linking from macOS: musl targets are self-contained, so the bundled lld is enough.
# C compiled by a build script (criterion's alloca) uses aarch64-linux-musl-gcc
# and x86_64-linux-musl-gcc from PATH. Those are compilers only; they are not the linker.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
